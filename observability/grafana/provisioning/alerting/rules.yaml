apiVersion: 1
groups:
- orgId: 1
  name: rabbitmq
  folder: MLOps
  interval: 10s
  rules:
  - uid: queue-saturation
    title: Очередь заполнена более чем на 90%
    condition: B
    for: 1m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Глубина ready держится выше 90% целую минуту. Одиночный всплеск успевает
        пройти.
    labels:
      component: pipeline
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource: &id001
          type: prometheus
          uid: prometheus
        expr: max by (queue) (rabbitmq_detailed_queue_messages_ready) / on(queue)
          (max by (queue) (pipeline_queue_limit) > 0)
        instant: true
        intervalMs: 5000
        maxDataPoints: 300
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          operator:
            type: and
          evaluator:
            type: gt
            params:
            - 0.9
  - uid: queue-dead-letters
    title: В DLQ есть сообщения
    condition: B
    for: 10s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Даже одно сообщение требует разбора. Пауза в 10 секунд подтверждает
        присутствие двумя оценками.
    labels:
      component: pipeline
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        datasource: *id001
        expr: max by (queue) (rabbitmq_detailed_queue_messages_ready{queue=~".+[.]dlq"})
        instant: true
        intervalMs: 5000
        maxDataPoints: 300
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          operator:
            type: and
          evaluator:
            type: gt
            params:
            - 0
