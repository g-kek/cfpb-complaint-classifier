[project]
name = "cfpb-complaint-classifier"
version = "0.1.0"
description = "MLOps-система для автоматической классификации и анализа клиентских жалоб"
readme = "README.md"
authors = [
    { name = "kekgerman", email = "kekgerman81@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[postgres,rabbitmq]>=4.15,<5",
]
ml = [
    "matplotlib>=3.9,<4",
    "mlflow==3.17.0",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
]
tracking = [
    "boto3>=1.35,<2",
    "mlflow==3.17.0",
    "psycopg2-binary>=2.9,<3",
]
serving = [
    "mlflow==3.17.0",
    "scikit-learn>=1.6,<2",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.6,<0.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
default-groups = ["web", "serving", "dev"]

[tool.pytest.ini_options]
markers = ["integration: requires Docker and isolated broker/database containers"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
addopts = [
    "--cov=cfpb_complaint_classifier",
    "--cov=training",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["cfpb_complaint_classifier", "training"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/test_pipeline_integration.py" = ["ASYNC109"]
"scripts/run_backpressure_experiments.py" = ["S603"]
"scripts/verify_alias_switch.py" = ["S607"]
"scripts/verify_backpressure_defense.py" = ["ASYNC110"]
