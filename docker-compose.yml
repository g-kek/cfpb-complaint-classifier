x-task-environment: &task-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfpb
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-cfpb}:${RABBITMQ_PASSWORD:-cfpb-local-password}@rabbitmq:5672/
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-complaints.tasks}
  BACKPRESSURE_ENABLED: ${BACKPRESSURE_ENABLED:-true}
  QUEUE_MAX_LENGTH: ${QUEUE_MAX_LENGTH:-20}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  PREFETCH_COUNT: ${PREFETCH_COUNT:-${WORKER_CONCURRENCY:-2}}
  INFERENCE_DELAY_SECONDS: ${INFERENCE_DELAY_SECONDS:-1}
  PUBLISH_TIMEOUT_SECONDS: ${PUBLISH_TIMEOUT_SECONDS:-1}
  SOURCE_RETRY_INITIAL_SECONDS: ${SOURCE_RETRY_INITIAL_SECONDS:-0.05}
  SOURCE_RETRY_MAX_SECONDS: ${SOURCE_RETRY_MAX_SECONDS:-0.5}
  SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-30}
  TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
  TASK_RETRY_DELAY_SECONDS: ${TASK_RETRY_DELAY_SECONDS:-0.5}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_DISCOVER_COLLECTOR: ${OTEL_DISCOVER_COLLECTOR:-true}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4318}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://metrics-collector:4318/v1/metrics}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-1}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
  OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=${OTEL_SERVICE_VERSION:-0.1.0},deployment.environment.name=${OTEL_ENVIRONMENT:-development}}
  OTEL_BSP_MAX_QUEUE_SIZE: 1024
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 128
  OTEL_BSP_SCHEDULE_DELAY: 1000

x-observer: &observer
  networks: [cfpb]
  environment: {GOMAXPROCS: "2"}

x-collector: &collector
  <<: *observer
  image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.134.0}
  mem_limit: 128m
  volumes:
    - ./observability/collector:/conf:ro

services:
  app:
    labels: {pipeline.logs: "true"}
    build:
      context: .
    image: cfpb-complaint-classifier:local
    environment:
      OTEL_SERVICE_NAME: ${API_OTEL_SERVICE_NAME:-api}
      OTEL_INSTANCE_ID: ${API_INSTANCE_ID:-api-1}
      <<: *task-environment
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - cfpb
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    labels: {pipeline.logs: "true"}
    build:
      context: .
    image: cfpb-complaint-classifier:local
    command:
      - uvicorn
      - cfpb_complaint_classifier.worker:create_worker_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      OTEL_SERVICE_NAME: ${WORKER_OTEL_SERVICE_NAME:-worker}
      <<: *task-environment
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-cfpb-complaint-classifier}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      model-check:
        condition: service_completed_successfully
    networks:
      - cfpb
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-40s}
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  source:
    labels: {pipeline.logs: "true"}
    profiles: ["batch"]
    build:
      context: .
    image: cfpb-complaint-classifier:local
    entrypoint: ["python", "-m", "cfpb_complaint_classifier.source"]
    command: ["/app/data/cfpb/test.csv", "--batch-id", "cfpb-test-v1"]
    environment:
      OTEL_SERVICE_NAME: ${SOURCE_OTEL_SERVICE_NAME:-source}
      OTEL_INSTANCE_ID: ${SOURCE_INSTANCE_ID:-batch-source}
      <<: *task-environment
    volumes:
      - ./data:/app/data:ro
      - ./docs/experiments/2026-10-21-final/input.csv:/app/example.csv:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cfpb

  db-init:
    build:
      context: .
    image: cfpb-complaint-classifier:local
    command: ["python", "-m", "cfpb_complaint_classifier.db.tasks"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfpb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cfpb

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cfpb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cfpb-local-password}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit collect_statistics_interval 1000"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - ./docker/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cfpb
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-check:
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    image: cfpb-model-check:local
    command: ["python", "-m", "training.bootstrap"]
    environment:
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-cfpb-complaint-classifier}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - cfpb

  training:
    image: cfpb-training:local
    profiles: ["training"]
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    environment:
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-cfpb-complaint-classifier}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f data/cfpb/manifest.json ]; then
          python -m training.prepare
        fi
        python -m training.eda
        python -m training.train
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - cfpb

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: cfpb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cfpb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfpb"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mlflow-db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    networks:
      - cfpb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: cfpb-minio:local
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - cfpb
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: cfpb-minio-init:local
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-local-password}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["python", "/app/init_bucket.py"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cfpb

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: cfpb-mlflow:local
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-local-password}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        exec mlflow server \
          --backend-store-uri "postgresql://mlflow:$$MLFLOW_DB_PASSWORD@mlflow-db:5432/mlflow" \
          --serve-artifacts \
          --artifacts-destination s3://mlflow-artifacts \
          --host 0.0.0.0 --port 5000 --workers 1 \
          --allowed-hosts 'localhost:*,127.0.0.1:*,mlflow:5000'
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - cfpb
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  loki:
    <<: *observer
    profiles: [logs, observability]
    image: grafana/loki:${LOKI_VERSION:-3.5.5}
    mem_limit: 320m
    command: [-config.file=/etc/loki/pipeline.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/pipeline.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  vector:
    <<: *observer
    profiles: [logs, observability]
    image: timberio/vector:${VECTOR_VERSION:-0.49.0-alpine}
    mem_limit: 128m
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      VECTOR_THREADS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on: [loki]

  tempo:
    <<: *observer
    profiles: [traces, observability]
    image: grafana/tempo:${TEMPO_VERSION:-2.8.2}
    mem_limit: 256m
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  collector:
    <<: *collector
    profiles: [traces, observability]
    command: ["--config=/conf/common.yaml", "--config=/conf/traces.yaml"]
    depends_on: [tempo]

  metrics-collector:
    <<: *collector
    profiles: [metrics, observability]
    command: ["--config=/conf/common.yaml", "--config=/conf/metrics.yaml"]

  prometheus:
    <<: *observer
    profiles: [metrics, observability]
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    mem_limit: 224m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
      - --enable-feature=exemplar-storage
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    <<: *observer
    profiles: [observability]
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}
    mem_limit: 288m
    environment:
      GOMAXPROCS: "2"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cfpb-local-grafana}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
  postgres-data:
  mlflow-db-data:
  minio-data:

networks:
  cfpb:
    driver: bridge
